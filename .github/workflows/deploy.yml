# Builds the app and publishes it to GitHub Pages on every push to main.
#
# The tests run before the build, and a failure stops the deploy. That is the
# point of running them here rather than only on a laptop: what is published is
# never something whose tests were failing.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets us republish without pushing, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one win rather than queueing
# a deploy of code that is already out of date.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `ci` rather than `install`: installs exactly what package-lock.json says,
      # so the published build matches what was tested locally.
      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build

      # research/ holds a book's patterns (book-presets.json) and photos
      # (sources/), for local use only. The app only reaches for them under
      # `npm run dev`; if a production build ever points at either, something
      # has gone wrong, and nothing gets published. (Citations of our own notes,
      # like "research/observations.md" in model/physical, are fine to ship —
      # they name a file, they don't contain anything from the book.)
      - name: Check no private research material is in the build
        run: |
          if grep -rqE "book-presets|research/sources" dist; then
            echo "The build points at private research material — refusing to publish."
            grep -rlE "book-presets|research/sources" dist
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
